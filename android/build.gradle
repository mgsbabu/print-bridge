// Versions are pinned to a combination that is known to build together:
//   Gradle 9.0.0 + AGP 8.12.0 (what React Native 0.81 ships against Gradle 9.0)
//   + Kotlin 2.1.20 + JDK 17. AGP 9.x needs Gradle 9.1+, so do not bump AGP
//   without bumping gradle-wrapper.properties too.
plugins {
    id 'com.android.application' version '8.12.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.20' apply false
}
