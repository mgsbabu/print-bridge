name: Release

on:
  push:
    tags:
      - "v*"
  # On-demand validation build. Produces an installer as a downloadable
  # workflow artifact WITHOUT publishing a GitHub Release — useful for
  # smoke-testing a Windows build before cutting a real `v*` tag.
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build (validation only; artifact, no publish)"
        type: choice
        default: win
        options:
          - win
          - mac
          - linux
          - android
          - all

permissions:
  contents: write

jobs:
  # Build the matrix dynamically so a workflow_dispatch run only spins up the
  # chosen platform. (A job-level `if` can't read the `matrix` context, so the
  # selection has to happen before the matrix is expanded.)
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          set -e
          mac='{"os":"macos-latest","platform":"mac","ebargs":"--mac --x64 --arm64"}'
          # Pinned to windows-2022 (not windows-latest). The newer
          # windows-2025 image breaks node-gyp's Visual Studio detection
          # when @electron/rebuild compiles the native @grandchef/node-printer
          # module ("Could not find any Visual Studio installation to use").
          win='{"os":"windows-2022","platform":"win","ebargs":"--win"}'
          linux='{"os":"ubuntu-latest","platform":"linux","ebargs":"--linux"}'
          sel="all"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sel="${{ github.event.inputs.platform }}"
          fi
          case "$sel" in
            win)   inc="$win" ;;
            mac)   inc="$mac" ;;
            linux) inc="$linux" ;;
            # android is built by its own job below; the desktop `build` job is skipped for it.
            # The matrix still needs one entry to expand, so hand it the cheapest.
            android) inc="$linux" ;;
            *)     inc="$mac,$win,$linux" ;;
          esac
          echo "matrix={\"include\":[$inc]}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    # Desktop installers only. platform=android runs the `android` job instead.
    if: ${{ github.event.inputs.platform != 'android' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # @grandchef/node-printer's binding.gyp uses `cups-config --cflags`
      # to find CUPS headers on Linux. Ubuntu runners ship without them.
      - name: Install CUPS dev libs (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libcups2-dev

      - run: npm ci

      - run: npm run build

      # Pass through signing env vars ONLY when the corresponding secrets
      # are actually set. Passing CSC_LINK="" makes electron-builder
      # treat the empty string as a file path and explode.
      - name: Configure signing env from secrets
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CERT_P12_BASE64: ${{ secrets.WIN_CERT_P12_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          set -e
          # Mac signing — only export if cert secret is present
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            echo "CSC_LINK=$MAC_CERT_P12_BASE64" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD" >> "$GITHUB_ENV"
            echo "MAC_NOTARIZE_FLAG=-c.mac.notarize=true" >> "$GITHUB_ENV"
          else
            echo "MAC_NOTARIZE_FLAG=" >> "$GITHUB_ENV"
          fi
          # Notarization creds — only export when present
          if [ -n "$APPLE_ID" ]; then
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi
          # Windows signing
          if [ -n "$WIN_CERT_P12_BASE64" ]; then
            echo "WIN_CSC_LINK=$WIN_CERT_P12_BASE64" >> "$GITHUB_ENV"
            echo "WIN_CSC_KEY_PASSWORD=$WIN_CERT_PASSWORD" >> "$GITHUB_ENV"
          fi

      # Tag push -> publish a GitHub Release. workflow_dispatch -> build only
      # (--publish never) and attach the installer as an artifact below.
      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUBLISH=never
          if [ "${{ github.event_name }}" = "push" ]; then PUBLISH=always; fi
          npx electron-builder ${{ matrix.ebargs }} ${MAC_NOTARIZE_FLAG:-} --publish "$PUBLISH"

      - name: Upload installer (validation artifact)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: print-bridge-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

  # Android APK (sideloaded onto POS machines; NOT published to Google Play).
  # Runs after the desktop build so that, on a tag, the GitHub Release electron-builder
  # created already exists and the APK is attached to the same release as the exe/dmg.
  android:
    needs: [setup, build]
    # `!cancelled()` so a failed or skipped desktop build does not block the APK.
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' ||
      github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships an Android SDK ($ANDROID_HOME). android-actions/setup-android
      # failed here with "6 of 7 SDK package licenses not accepted", so accept the licences on the
      # preinstalled SDK ourselves; AGP then downloads any missing platform/build-tools.
      - name: Accept Android SDK licences
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ls "$ANDROID_HOME/licenses"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -e
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(node -p "require('./package.json').version")"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # The keystore never lives in the repo. A tag build refuses to ship without it, because a
      # debug-signed APK cannot be updated in place by the real one later.
      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed APK. See docs/android-bridge.md."
              exit 1
            fi
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: validation build is signed with the debug key. Do not distribute it."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease -PAPP_VERSION_NAME=${{ steps.version.outputs.version }}

      - name: Name the APK
        id: apk
        shell: bash
        run: |
          set -e
          out="TailorApp-Print-Bridge-${{ steps.version.outputs.version }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      # Tag push -> attach to the same GitHub Release as the exe/dmg.
      - name: Attach APK to the GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          # electron-builder normally created the release already; create it only if every desktop job failed.
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "" --verify-tag
          gh release upload "$tag" "${{ steps.apk.outputs.file }}" --clobber

      # workflow_dispatch -> artifact only, no release.
      - name: Upload APK (validation artifact)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: print-bridge-android
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
